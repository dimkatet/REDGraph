; REDGraphSelfTest - which of the host's self-tests run (docs/internals.md "Self-tests"). Results go to REDGraph's log.
[Tests]
; M5-M10: resources by name, our node, wrap / remove / replace, engine-ring descriptors. Needs REDGraph.ini's
; [Diagnostics] RenderGraphDump = true. On screen: the world's clouds vanish / a striped sky every other 10 s.
FlowProbe = false
; M12: 1 = an RT sun-shadow raygen variant switched live in its node (shadows vanish every other 10 s);
; 2 = scoped to a foreign node (nothing changes, out_of_scope grows). 0 = off. Needs the game blobs at build time.
RtVariantTest = 0
; M3 swap: 1 = the RT sun-shadow library swapped whole for one with its main raygen "lit" (shadows gone for the
; session; switch off a client's variant of that raygen first, e.g. CRT's grass shadow). 0 = off. Needs the game blobs.
RtSwapTest = 0
; M11: 1 = the game's own sky PS swapped for itself inside its node (swaps grow); 2 = scoped to a foreign node
; (out_of_scope grows). 0 = off. Needs the game blobs at build time.
PatchScopeTest = 0
; M2 texture sources: a companion of the tonemapping-LUT CS reads a texture of ours (a 2D_ARRAY view of one slice) and
; the engine's LUT by name (a 3D UAV view); checked against known values / a copy every 300 frames. Nothing on screen.
LeaseTexTest = false
; M1 composition: a VS and a PS patch (the game's own sky shaders, swapped for themselves) on one PSO, switched
; independently in four phases of 600 sky runs; PASS / FAIL per phase. Nothing on screen; takes both shaders from any
; other client (CRT's sky patch, PatchScopeTest) for the session. Needs the game blobs at build time.
ComposeTest = false
; M1 pipeline state: the visible sky's PS with state-only variants - every 10 s vanilla, WIREFRAME, nothing written.
; On screen only far off: this is the sky's bottom layer, clouds / fog / aerial cover most of it. PASS / FAIL per phase.
StateTest = false
; M8 declarations: a transient of ours (written in Lighting) declared by a wrap of a PostFX node (node_wrap_use) must
; reach it intact; every 1800 frames PASS / FAIL. Nothing on screen.
WrapUseTest = false
; M4 graphics wing: draw subscriptions on the visible sky, a wireframe draw companion of it and a pass after its draw,
; in phases of 600 sky draws; PASS / FAIL per phase. On screen only far off (wireframe sky edges in the companion phase).
DrawTest = false
; compile_hlsl: a good cs_6_0, a broken ps_6_0, an RT library refused; PASS / FAIL at registration. With LeaseTexTest
; also on, that test's companion is compiled at runtime from lease_tex.hlsl (its content checks prove it runs). Needs
; dxcompiler.dll + dxil.dll next to REDGraph.dll (build_and_deploy.ps1 -Dxc), else "UNAVAILABLE". Nothing on screen.
HlslTest = false
